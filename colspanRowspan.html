<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rowspan & Colspan </title>
    <style>
        table,th,td{
            border: 1px solid rgba(86, 11, 17, 0.79);text-align: center;
        }
        table{
            border-collapse: collapse;
        }
        </style>
</head>
<body>
    <h3>A Test Table With Merged Cells</h3>
    <table>
        <thead>
            <tr>
            <th rowspan="2" >Gender</th>
            <th colspan="2">Average</th>
            <th rowspan="2">Red <br>Eyes</th>
            </tr>
            <tr>
                <th>Height</th>
                <th>Weight</th>
                
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Males</td>
                <td>1.9</td>
                <td>0.003</td>
                <td>43%</td>
            </tr>
            <tr>
                <td>Females</td>
                <td>1.7</td>
                <td>0.002</td>
                <td>40%</td>
            
            </tr>
            <tr></tr>



        </tbody>

</table>
</body>
</html>
