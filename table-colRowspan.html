<!DOCTYPE html>
<html lang="en">
   <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table </title>
    <style>
        table,th,td{
            border: 1px solid rgba(5, 5, 125, 0.675); text-align: center;
        }
        table{
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>SI NO.</th>
                <th>Company</th>
                <th>Contact</th>
                <th>Country</th>
              </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">1</td>
                <td>Alfreds Futterkiste</td>
                <td>Maria Anders</td>
                <td>Germany</td>
              </tr>
              <tr>
                
                <td>Centro comercial Moctezuma</td>
                <td>Francisco Chang</td>
                <td>Mexico</td>
              </tr>
              <tr>
                <td>total</td>
                <td colspan="3"></td>
                
                
              </tr>
        </tbody>
        
      </table>
</body>
</html>
